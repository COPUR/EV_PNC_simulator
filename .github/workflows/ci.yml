name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Fetch the pinned hub contracts
        run: make contracts
      - run: make lint
      - run: make test

  image:
    # The mock runs as a container in CI (P1-04 acceptance): build it, start it, call it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make image
      - run: make smoke
