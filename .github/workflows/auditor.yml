name: auditor

# Calls the shared CI auditor in COPUR/EV_PNC_infra-modules: gitleaks secret scan (project rules
# + this repo's .gitleaks.toml) and repository / workflow hygiene checks. See auditor/README.md there.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly full-history rescan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    uses: COPUR/EV_PNC_infra-modules/.github/workflows/ci-auditor.yml@fea3badde8c959c4a0ae50ab55ee86a7eecbfd83 # EV_PNC_infra-modules
    with:
      public: true
      auditor-ref: fea3badde8c959c4a0ae50ab55ee86a7eecbfd83 # same commit as above; selects the scripts the workflow runs
