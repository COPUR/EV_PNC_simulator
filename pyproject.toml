[project]
name = "ev-pnc-simulator"
version = "0.1.0"
description = "Mock hubs and simulators for EV_PNC: Hubject OICP/OPCP, GIREVE IOP and PNCP, built from the pinned contracts"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "starlette>=0.40",
  "uvicorn>=0.30",
  "jsonschema>=4.21",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ev-pnc-hubject-mock = "ev_pnc_simulator.hubject.__main__:main"
ev-pnc-gireve-mock = "ev_pnc_simulator.gireve.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ev_pnc_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py311"
